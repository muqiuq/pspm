# PSPM fixed http-level settings. Part of every release (copied from /opt/pspm/nginx/static).

sendfile on;
tcp_nopush on;
server_tokens off;
keepalive_timeout 65s;
types_hash_max_size 2048;
server_names_hash_bucket_size 128;
server_names_hash_max_size 4096;
variables_hash_bucket_size 128;
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;
client_body_buffer_size 128k;
large_client_header_buffers 4 32k;
# Response headers from backends (default; a backend can raise it, Renderer::proxyBuffers).
# nginx's own default is one memory page (4k), which many applications exceed (cookies, CSP).
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
ssl_session_cache shared:pspm_tls:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Logs. The security log is one JSON line per request (plan §15.1): never cookies,
# auth headers, bodies or referers.
log_format pspm_main '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                     '"$http_user_agent" rt=$request_time ut=$upstream_response_time site=$pspm_site out=$pspm_outcome';
log_format pspm_security escape=json '{"t":"$time_iso8601","ip":"$remote_addr","host":"$host","site":"$pspm_site",'
    '"port":"$server_port","m":"$request_method","uri":"$request_uri","nuri":"$uri","st":"$status",'
    '"ust":"$upstream_status","tls":"$ssl_protocol","cert":"$ssl_client_verify","fp":"$ssl_client_fingerprint",'
    '"lan":"$pspm_lan","ua":"$http_user_agent","rl":"$request_length","bs":"$bytes_sent","rt":"$request_time",'
    '"urt":"$upstream_response_time","out":"$pspm_outcome","lst":"$pspm_listener","user":"$pspm_email"}';
access_log /var/log/nginx/access.log pspm_main;
access_log /var/log/nginx/pspm-security.log pspm_security;

map $http_upgrade $pspm_connection_upgrade {
    default upgrade;
    ''      '';
}

# Never-blocked ranges (plan §14.2): private, loopback, link-local. Kept in sync with
# PHP (IP::NEVER_BLOCKED), SQL (pspm_never_blocked), Lua and the firewall rules.
geo $pspm_private {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    127.0.0.0/8    1;
    ::1/128        1;
    fc00::/7       1;
    fe80::/10      1;
}

# A request by IP address (or without a host name): $host is an IPv4 or [IPv6] literal.
map $host $pspm_host_is_ip {
    default                 0;
    ""                      1;
    ~^[0-9.]+$              1;
    ~^\[?[0-9a-fA-F:.]+\]?$ 1;
}

# The UI by IP: only while no admin host name is in effect (rendered servers decide),
# only for IP-literal requests, only from private addresses.
map "$pspm_private$pspm_host_is_ip" $pspm_ip_ui {
    default 0;
    "11"    1;
}

lua_shared_dict pspm_cleared 16m;
lua_shared_dict pspm_banned   4m;
lua_shared_dict pspm_blocked 16m;
lua_shared_dict pspm_trusted  8m;
lua_shared_dict pspm_certs    8m;
lua_shared_dict pspm_meta     1m;
lua_shared_dict pspm_traps    4m;
lua_shared_dict pspm_unknown 10m;
lua_shared_dict pspm_cfg      1m;
# Lua runs first in the rewrite phase, so blocks and the catch-all decide before any return.
rewrite_by_lua_no_postpone on;
# $pspm_outcome and the identity variables are set by Lua only when they apply.
uninitialized_variable_warn off;

limit_req_zone  $binary_remote_addr zone=pspm_ui:10m     rate=5r/s;
limit_req_zone  $binary_remote_addr zone=pspm_login:10m  rate=10r/m;
limit_req_zone  $binary_remote_addr zone=pspm_access:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=pspm_signin:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=pspm_conn:10m;
limit_req_status  429;
limit_conn_status 429;
